# Golden evaluation set of hand-labeled competitor updates with promptfoo assertions.
# Used by promptfoo to assert classification accuracy.
# Target Domain: luxury passenger vehicles and premium electric cars
# Focus Subdomain: infotainment and telematics

- vars:
    primary_domain: "luxury passenger vehicles and premium electric cars"
    competitor: "Mercedes-Benz"
    title: "Mercedes-Benz launches MB.OS with integrated Google Maps and YouTube"
    description: "Mercedes-Benz unveiled its custom-built MB.OS architecture, introducing native Google Maps navigation, YouTube streaming, and automated lane-change visual aids to all new E-Class infotainment systems."
  assert:
    - type: is-json
    - type: javascript
      value: "JSON.parse(output).is_material === true"

