name: Process Feedback Issue

on:
  issues:
    types: [opened]

jobs:
  process-feedback:
    # Only run if the issue title matches the expected feedback prefix
    if: startsWith(github.event.issue.title, 'feedback:')
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/pm-competitive-intel-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Parse and record feedback
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python src/process_feedback.py

      - name: Commit and Push preference memory updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/preference_memory.yaml
          
          # Only commit and push if the state was updated
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: record user feedback preference updates [skip ci]"
            git push
          else
            echo "No preference memory changes to commit."
          fi

      - name: Close feedback issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Close issue and leave a helpful comment
          gh issue close "${{ github.event.issue.number }}" --comment "Feedback processed. This will be folded into tomorrow's ranking step. Thank you!"
